name: svf-teaching

# Triggers the workflow on push or pull request events
on: [push, pull_request]

env:
  # Keep this version in sync with the prebuilt svf-lib package.
  LLVM_VERSION: '22.1.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      # checkout the repo
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18

      # setup the Ubuntu environment; macOS uses the runner's default Xcode
      - name: ubuntu-setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ doxygen graphviz lcov libncurses5-dev libtinfo6 libzstd-dev

      # install llvm and svf
      - name: env-setup
        run: |
          npm install svf-lib
      # set SVF_DIR, LLVM_DIR and Z3_DIR and build
      - name: build
        run: |
          export SVF_DIR=$(npm root)/SVF
          export LLVM_DIR="$(npm root)/llvm-${LLVM_VERSION}.obj"
          export Z3_DIR=$(npm root)/z3.obj
          echo "SVF_DIR="$SVF_DIR
          echo "LLVM_DIR="$LLVM_DIR
          echo "Z3_DIR="$Z3_DIR
          cmake .
          make
